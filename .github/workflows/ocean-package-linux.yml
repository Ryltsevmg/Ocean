name: Ocean unsigned Linux package
on:
  # Register the definition on GitHub; jobs still require a manual dispatch.
  push:
    branches: [main]
    paths: ['.github/workflows/ocean-package-linux.yml']
  workflow_dispatch:
    inputs:
      architecture:
        description: Native hosted runner architecture
        type: choice
        required: true
        default: x64
        options:
          - x64
          - arm64
      build_version:
        description: Extended build version (empty packages the checkout product version)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Ryltsevmg/Ocean' && github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    env:
      OCEAN_ARCH: ${{ inputs.architecture }}
      OCEAN_BUILD_VERSION: ${{ inputs.build_version }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - name: Test offline release verification
        run: node --test apps/desktop/scripts/ocean-release-signing.test.mjs apps/desktop/scripts/ocean-release-manifest.test.mjs apps/desktop/scripts/ocean-linux-update-policy.test.mjs apps/desktop/scripts/ocean-linux-archive-policy.test.mjs
      - name: Install pinned package manager
        run: npm install --global pnpm@11.28.5
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Package unsigned native Linux archive
        shell: bash
        run: |
          set -euo pipefail
          case "$OCEAN_ARCH" in x64|arm64) ;; *) exit 1 ;; esac
          test "$(node -p process.arch)" = "$OCEAN_ARCH"
          args=()
          if [ -n "$OCEAN_BUILD_VERSION" ]; then args+=(--build-version "$OCEAN_BUILD_VERSION"); fi
          pnpm --filter @ocean/ocean-desktop run "package:linux:$OCEAN_ARCH" ${args[@]+"${args[@]}"}
      - name: Calculate archive checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "apps/desktop/.desktop-build/targets/linux-$OCEAN_ARCH/unsigned-artifacts"
          sha256sum *.tar.gz > SHA256SUMS
          node -e 'require("node:fs").writeFileSync("build-evidence.json", JSON.stringify({repository: process.env.GITHUB_REPOSITORY, commit: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID, version: process.env.OCEAN_BUILD_VERSION || null, architecture: process.env.OCEAN_ARCH, node: process.version, signed: false}, null, 2) + "\n")'
      - name: Retain unsigned build for review, not release publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocean-linux-${{ inputs.architecture }}-unsigned-${{ github.sha }}
          path: |
            apps/desktop/.desktop-build/targets/linux-${{ inputs.architecture }}/unsigned-artifacts/*.tar.gz
            apps/desktop/.desktop-build/targets/linux-${{ inputs.architecture }}/unsigned-artifacts/SHA256SUMS
            apps/desktop/.desktop-build/targets/linux-${{ inputs.architecture }}/unsigned-artifacts/build-evidence.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

# Manual-dispatch Linux packaging (Ocean; unsigned by default)

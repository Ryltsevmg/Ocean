name: Ocean verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OCEAN_GATE_CONCURRENCY: '1'
  OCEAN_OXLINT_THREADS: '1'
  OCEAN_COVERAGE_MAX_WORKERS: '1'
  OCEAN_PUBLINT_CONCURRENCY: '1'

jobs:
  static:
    if: github.repository == 'Ryltsevmg/Ocean'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - name: Test offline release verification
        run: node --test apps/desktop/scripts/ocean-release-signing.test.mjs apps/desktop/scripts/ocean-release-manifest.test.mjs apps/desktop/scripts/ocean-linux-update-policy.test.mjs apps/desktop/scripts/ocean-linux-archive-policy.test.mjs
      - name: Install pinned package manager
        run: npm install --global pnpm@11.28.5
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check lint
        run: pnpm run lint
      - name: Check duplication
        run: pnpm run duplication
      - name: Check documentation and generated references
        run: pnpm run doc-sync
      - name: Check localization
        run: pnpm run check:i18n

  security:
    if: github.repository == 'Ryltsevmg/Ocean'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Gitleaks diffs the event's commit range, which needs full history.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.28.5
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit dependencies for high and critical advisories
        run: pnpm audit --audit-level=high
      - name: Scan the event diff for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  unit-coverage:
    if: github.repository == 'Ryltsevmg/Ocean'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      OCEAN_EXAMPLE_MODE: lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.28.5
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare and probe the Linux sandbox
        run: bash scripts/prepare-ci-bubblewrap.sh
      - name: Require PowerShell coverage support
        run: pwsh -NoLogo -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion'
      - name: Build runtime artifacts for process fixtures
        run: pnpm run build:artifacts --serial
      - name: Test unit inventory with per-file coverage
        # The aggregate also runs its compiler-heavy exemptions uninstrumented.
        # One gate and one worker keep those inventories disjoint and sequential.
        run: pnpm run check:ci:coverage

  integration:
    if: github.repository == 'Ryltsevmg/Ocean'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OCEAN_EXAMPLE_MODE: lib
      OCEAN_SNAPSHOT: replay
      OCEAN_SNAPSHOT_MAX_WORKERS: '1'
      OCEAN_SNAPSHOT_MAX_CONCURRENCY: '1'
      OCEAN_WEB_SNAPSHOT_WORKERS: '1'
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.28.5
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare and probe the Linux sandbox
        run: bash scripts/prepare-ci-bubblewrap.sh
      - name: Build artifacts and check types
        run: pnpm run build --serial
      - name: Test assembled CLI expectations
        run: pnpm run test:expected --maxWorkers=1
      - name: Install locked browser engines and host libraries
        run: pnpm --dir apps/web exec playwright install --with-deps chromium webkit
      - name: Replay recorded sessions
        run: pnpm run test:snapshot
      - name: Install pinned Python tooling
        run: |
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/python-sdk-venv" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/uv"
          "$RUNNER_TEMP/uv/bin/python" -m pip install uv==0.13.9
      - name: Install locked Python SDK test dependencies
        run: '"$RUNNER_TEMP/uv/bin/uv" sync --locked --project python/sdk --group test --python python3'
      - name: Test Python SDK and built runtime projections
        run: '"$RUNNER_TEMP/uv/bin/uv" run --no-sync --directory python/sdk pytest -ra'
      - name: Compare Web snapshots
        # Live HMR fixtures rebuild artifacts, so browser tests own the final step.
        run: pnpm run test:web:ci

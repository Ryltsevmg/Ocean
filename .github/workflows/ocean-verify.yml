name: Ocean verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'Ryltsevmg/Ocean'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - name: Test offline release verification
        run: node --test apps/desktop/scripts/ocean-release-signing.test.mjs apps/desktop/scripts/ocean-release-manifest.test.mjs apps/desktop/scripts/ocean-linux-update-policy.test.mjs apps/desktop/scripts/ocean-linux-archive-policy.test.mjs
      - name: Install pinned package manager
        run: npm install --global pnpm@11.28.5
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build artifacts and check types
        run: pnpm run build --serial
      - name: Check localization
        run: pnpm run check:i18n
      - name: Test plugin inventory and package policies
        run: pnpm exec vitest run packages/boot/plugin-manager/tests/manager.spec.ts scripts/ocean-verification-workflow.spec.ts --maxWorkers=1
      - name: Test theme and dock geometry
        run: pnpm exec vitest run packages/client/ui-theme/tests packages/client/ui-dockkit/tests/tab-layout.client.spec.tsx packages/client/ui-dockkit/tests/geometry.client.spec.ts packages/client/ui-dockkit/tests/app-region-styles.client.spec.ts --maxWorkers=1
      - name: Test isolated Codex integration
        run: pnpm --dir vendor/codex-subscription run test:ocean

# Ocean verification workflow (active)

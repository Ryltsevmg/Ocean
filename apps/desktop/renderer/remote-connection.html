<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; form-action 'none'; base-uri 'none'">
  <link rel="stylesheet" href="remote-connection.css">
  <script src="remote-connection.js" type="module"></script>
</head>
<body>
  <form autocomplete="off">
    <header>
      <h1 id="title"></h1>
      <p id="hint" class="hint"></p>
    </header>
    <div class="field" id="address-field">
      <label><span id="address-label"></span><input id="address" type="text" inputmode="url" list="saved-addresses" placeholder="https://" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <datalist id="saved-addresses"></datalist>
      <button id="forget" class="link" type="button" hidden></button>
    </div>
    <div class="field" id="ssh-field">
      <label><span id="ssh-label"></span><input id="ssh-host" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <p id="ssh-hint" class="hint"></p>
      <button id="ssh-start" type="button"></button>
    </div>
    <label id="token-row"><span id="token-label"></span><input id="token" type="password" autocomplete="off"></label>
    <div class="field" id="remember-field">
      <label id="remember-row" class="remember"><input id="remember" type="checkbox"><span id="remember-label"></span></label>
      <p id="save-hint" class="hint" hidden></p>
      <p id="host-identity" class="hint" hidden></p>
    </div>
    <div class="feedback"><p id="failure" role="alert" hidden></p></div>
    <footer>
      <button id="close" type="button"></button>
      <button id="connect" type="submit" disabled></button>
    </footer>
  </form>
</body>
</html>

# Python PTC composition: replace the Node provider through
# the real Loader and render the generated Python SDK prompt.
- id: agent-default-model
  name: '@ocean/ocean-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@ocean/ocean-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js 'process.env.DSH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@ocean/ocean-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-executor-native
  disabled: true

- id: tool-executor-ptc
  disabled: false

- id: ptc-runtime
  disabled: true

- id: workflow-ptc
  disabled: true

- id: tool-workflow
  disabled: true

- insert:
    - id: ptc-runtime-python
      name: '@ocean/ocean-experimental-ptc-runtime-python'

- id: system-prompt
  name: '@ocean/ocean-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.

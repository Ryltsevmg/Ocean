# Session-root sandbox snapshot overlay. The generated session cwd lives
# outside the automatic temp grants, while this deployment fallback points at
# /tmp. A workspace-write mutation can therefore succeed only when the calling
# session's cwd replaces the process-level fallback root.
- id: sandbox-policy
  name: '@ocean/ocean-sandbox-policy'
  config:
    mode: !!js "process.env.OCEAN_PERMISSION_MODE ?? (process.env.OCEAN_SNAPSHOT === undefined ? 'workspace-write' : 'danger-full-access')"
    workspaceRoot: /tmp

- id: headless-runner
  inject: [headlessStartup]
  config:
    task: !!js ctx.headlessStartup.task
    sessionId: !!js ctx.headlessStartup.sessionId
    json: !!js ctx.headlessStartup.json
    permissionMode: workspace-write

- insert:
    - id: session-write-grant
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/session-write-grant.ts'

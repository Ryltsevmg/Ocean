# Workspace-context snapshot patch: the harness exports OCEAN_HOME=<cwd>/.ocean and
# OCEAN_AGENTS_HOME=<cwd>/.agents, so project-root and both user-global root
# discoveries stay inside the scenario's temporary cwd.
- id: agent-default-model
  name: '@ocean/ocean-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@ocean/ocean-session-persistence-jsonl'
  config:
    root: !!js oceanHomePath('sessions')
    compression: !!js 'process.env.OCEAN_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@ocean/ocean-agent-instructions'
  config:
    maxBytes: 700
    projectRootMarkers:
      - .ocean-project

- id: system-prompt
  name: '@ocean/ocean-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.

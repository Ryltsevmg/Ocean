- insert:
    - id: office-kit
      name: '@ocean/ocean-office-kit'
      config:
        outputDirectory: !!js dshHomePath('office-kit', 'outputs')

    - id: tool-office
      name: '@ocean/ocean-tool-office'

    - id: workspace-dependencies
      name: '@ocean/ocean-tool-workspace-dependencies'
      config:
        source: !!js process.cwd() + '/runtime-source'
        root: !!js process.cwd() + '/runtime-installed'

    - id: skill-office
      name: '@ocean/ocean-skill-office'
      config:
        assetRoot: !!js process.cwd() + '/office-skills'

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

# Keyless replay counterpart to cordis.yml.
- id: llm-deepseek
  name: '@ocean/ocean-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: terminal-controller-fixture
      name: './terminal-controller-fixture.mjs'
    - id: optional-persistent-terminals
      name: cordis:group
      group: true
      isolate:
        terminals: true
      config:
        - id: pty
          name: '@ocean/ocean-terminal'
        - id: terminal-panel
          name: '@ocean/ocean-terminal-panel'
        - id: tool-terminal
          name: '@ocean/ocean-tool-terminal'
    - id: llm-replay
      name: '@ocean/ocean-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- id: plugin-package-inventory-deepseek
  disabled: true

- insert:
    - id: cua-provider-registry
      name: '@ocean/ocean-computer-use'
    - id: cua
      name: '@ocean/ocean-experimental-cua-macos'
      disabled: !!js process.platform !== 'darwin'
      config:
        agentPreset: ptc
    - id: cua-windows
      name: '@ocean/ocean-cua-windows'
      disabled: !!js process.platform !== 'win32'
      config:
        agentPreset: ptc
    - id: cua-linux
      name: '@ocean/ocean-cua-linux'
      disabled: !!js process.platform !== 'linux'
      config:
        agentPreset: ptc
    - id: ui-cua
      name: '@ocean/ocean-cua'
